name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish a Minecraft download enabled pre-release after successful builds'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe

  prerelease:
    name: Publish Pre-release
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release prerelease:')) || (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease)) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified Release build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: Release *
          path: prerelease-dist
          merge-multiple: true

      - name: Publish GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          original="prerelease-dist/Plain Craft Launcher 2.exe"
          test -s "$original"
          asset="prerelease-dist/Plain Craft Launcher (PCL) - Modrinth Region Checked.exe"
          mv "$original" "$asset"
          tag="pcl-modrinth-region-${GITHUB_SHA:0:8}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Pre-release $tag already exists; keeping the existing verified release."
            exit 0
          fi
          cat > prerelease-notes.md <<'NOTES'
          這是基於 Plain Craft Launcher（PCL）的第三方非官方預發布測試版。

          - **社群資源：** 使用 Modrinth，暫停 CurseForge API 連線，但保留相關原始碼。
          - **地區檢查 v2：** 使用 Cloudflare、ipwho.is，必要時再以 country.is 交叉比對 IP 出口國家。至少兩個來源一致才允許下載；中國大陸（CN）、不足以確認或結果衝突時暫停下載。Windows 代理／VPN 線索僅供參考，不再單憑此封鎖。
          - **本次修正：** 修復已識別國家代碼（例如 TW）時，VB.NET 將字串誤當 Boolean 導致地區提示中斷的錯誤。
          - **地區顯示：** 首次進入提示地區與下載可用性，之後在左上角常駐顯示，點擊可重新檢查。
          - **設定介面：** 登錄檔隔離改為狀態文字與「更改」按鈕，切換後重啟生效。
          - **Microsoft 正版登入：** 本版本不內建 Client ID；401 訊息已加入診斷說明，但尚未修復或驗證登入服務授權。

          注意：此檢查僅使用 IP 定位，**不使用 GPS**。無法識別所有 VPN，也不能保證用戶端防竄改或符合所有地區的法規。這是 Windows Release 組態的預發布版，尚未完成 GUI、網路地區與登入功能的實際驗證。

          PCL 原始專案：https://github.com/Meloong-Git/PCL
          原始碼與授權說明：https://github.com/Ray20123315/PCL/blob/main/LICENCE
          NOTES
          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Plain Craft Launcher (PCL) - Modrinth Region Checked (Pre-release)" \
            --prerelease \
            --latest=false \
            --notes-file prerelease-notes.md
