name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish a Minecraft download enabled pre-release after successful builds'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe

  prerelease:
    name: Publish Pre-release
    if: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release prerelease:')) || (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified Release build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: Release *
          path: prerelease-dist
          merge-multiple: true

      - name: Publish GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          original="prerelease-dist/Plain Craft Launcher 2.exe"
          test -s "$original"
          asset="prerelease-dist/Plain Craft Launcher (PCL) - Minecraft Download Enabled.exe"
          mv "$original" "$asset"
          tag="pcl-minecraft-download-${GITHUB_SHA:0:8}"
          cat > prerelease-notes.md <<'NOTES'
          Third-party modified build of Plain Craft Launcher (PCL), not an official PCL release.

          Change: Minecraft version downloads are enabled by setting RestrictMcDownload to False.
          Built with the repository's Windows Release configuration; this is a preview build, not a gameplay/download compatibility certification.

          Original PCL project: https://github.com/Meloong-Git/PCL
          Source and licensing guidance: https://github.com/Ray20123315/PCL/blob/main/LICENCE
          NOTES
          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Plain Craft Launcher (PCL) - Minecraft Download Enabled (Pre-release)" \
            --prerelease \
            --latest=false \
            --notes-file prerelease-notes.md
